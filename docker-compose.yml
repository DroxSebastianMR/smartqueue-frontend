services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: smartqueue
      POSTGRES_USER: smartqueue
      POSTGRES_PASSWORD: smartqueue
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartqueue -d smartqueue"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - smartqueue_postgres:/var/lib/postgresql/data

volumes:
  smartqueue_postgres:

